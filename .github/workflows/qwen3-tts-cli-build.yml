name: Temporary Qwen3-TTS Linux CPU CLI build
on:
  push:
    branches: [tools/qwen3-tts-drive-transfer-20261115]
    paths: ['.github/workflows/qwen3-tts-cli-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Build upstream public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/predict-woo/qwen3-tts.cpp.git tts
          cd tts
          git submodule update --init --recursive
          cmake -S ggml -B ggml/build -DGGML_NATIVE=OFF -DGGML_BLAS=OFF -DGGML_CUDA=OFF -DGGML_METAL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build ggml/build --parallel 4
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build build --parallel 4 --target qwen3-tts-cli
          ldd build/qwen3-tts-cli
          mkdir -p package/lib package/bin
          cp build/qwen3-tts-cli package/bin/
          find ggml/build/src -maxdepth 3 -type f -name 'libggml*.so*' -exec cp -L {} package/lib/ \;
          (cd package && tar czf ../../qwen3-tts-cpu-linux-x86_64.tar.gz .)
          ls -lh ../qwen3-tts-cpu-linux-x86_64.tar.gz
      - name: Export CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-cpu-linux
          path: qwen3-tts-cpu-linux-x86_64.tar.gz
          retention-days: 1
          compression-level: 1
