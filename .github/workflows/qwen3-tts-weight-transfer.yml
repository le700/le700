name: Temporary Qwen3 TTS main model transfer
on:
  push:
    branches:
      - tools/qwen3-tts-drive-transfer-20261115
permissions:
  contents: read
jobs:
  fetch-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download public Qwen3 TTS main model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p weights
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 1200 \
            'https://huggingface.co/TeALO/qwen3-tts-gguf/resolve/main/qwen3-tts-0.6b-q8_0.gguf?download=true' \
            -o weights/qwen3-tts-0.6b-q8_0.gguf
          test "$(stat -c %s weights/qwen3-tts-0.6b-q8_0.gguf)" -eq 1342925920
          sha256sum weights/qwen3-tts-0.6b-q8_0.gguf | tee SHA256SUMS.txt
      - name: Upload model transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-main-q8-0
          path: |
            weights/qwen3-tts-0.6b-q8_0.gguf
            SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
